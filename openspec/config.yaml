schema: spec-driven

context: |
  Product: Time Station, an always-on smart desk calendar and weather station
  for Raspberry Pi 4 with a 7-inch touch display in kiosk mode.
  UI locale: Traditional Chinese (zh-TW); lunar-calendar support is required.

  Stack: Electron 44, Vue 3 Composition API, Vite 8, Tailwind CSS 4.
  Package manager: npm with the repo's package-lock.json. Build targets Linux
  ARM64 AppImage.

  Architecture: Electron main process is in electron/; Vue renderer is in src/.
  Use Vue ref/computed for local state. Keep API keys out of source control: they
  live in .env as VITE_* and are baked into the bundle at build time.

  Configuration: there is no runtime configuration file. src/defaultConfig.js is the
  single source of built-in defaults and must stay a leaf module with no imports;
  changing a value requires a rebuild and redeploy. Consuming modules must not
  declare defaults of their own - a missing value's fallback resolves to that source,
  and the operator follows whether 0 is a legal value for the setting. Keep
  ConfigManager.loadConfig() as the awaitable, injectable load point.

  Constraints: optimize for Raspberry Pi performance, high contrast, and low
  animation cost. Weather refreshes should conserve API quota. Validate UI
  changes in Electron development mode with npm run electron:dev, run npm test
  (node --test tests/*.test.mjs && npm run build), and validate production
  output with npm run build.

rules:
  proposal:
    - State the affected Electron main-process, renderer, configuration, and hardware boundaries.
    - Identify Raspberry Pi performance or kiosk-display impact when relevant.
  specs:
    - Use SHALL requirements and Given/When/Then scenarios for observable behavior.
  design:
    - Describe main-process and renderer responsibilities for cross-process changes.
    - Include configuration and API-key handling for external-service changes.
  tasks:
    - Include the applicable validation command or manual Electron verification step.
