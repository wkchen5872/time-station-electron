  <!-- ===== 說明 ===== -->
  <text x="20" y="1864" font-size="13" font-weight="600" fill="#9AA4B2">說明</text>
  <g font-size="13" fill="#B6BEC8">
    <text x="20" y="1888">· 控制項改用 codex v4 的分段切換：Codex／Claude 兩段同時可見、當前段填色，取代原本「按一次才知道切到哪」的循環按鈕。</text>
    <text x="20" y="1910">· 兩版上線後控制項位置與段序一致（固定 Codex 在左、Claude 在右），只有填色的段不同，避免切換時控制項本身也在變。</text>
    <text x="20" y="1932">· 睡眠膠囊沿用 codex 的全圓角描邊樣式；自動為描邊、開啟為填色，與分段切換的當前段用同一個填色語彙。</text>
    <text x="20" y="1954">· 其餘版面為 Claude 6:4 版，未因本次調整而更動。左欄控制項佔 x 36–438，480px 下右側留 42px。</text>
    <text x="20" y="1976">· 未採用 codex v4 的其他元素：農曆置於時鐘上方、「目前預報」標籤、「示意資料」頁腳。這些是獨立議題，未在本次要求範圍。</text>
    <text x="20" y="1998">· 仍待決：7:3 或 6:4、時鐘字重（本稿 500，現行實作為 700）、「目前預報」標籤與資料過期標示、控制項是否閒置後淡出。</text>
    <text x="20" y="2020">· 本預覽為 macOS 以 Noto Sans TC 算圖，不等於 Pi 面板呈現；控制項對比與觸控尺寸仍須實機確認。</text>
  </g>
</svg>
