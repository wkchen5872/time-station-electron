  <rect width="840" height="2060" fill="#07090B"/>

  <text x="20" y="28" font-size="17" font-weight="600" fill="#E8EAED">Time Station · 設計提案 V4 · Claude 版（claude-s01）</text>
  <text x="20" y="48" font-size="12.5" fill="#6B7682">左 480 / 右 320 · 控制項樣式取自 desgin-codex-v4（分段切換 + 睡眠膠囊）· 其餘版面為 Claude 6:4 版 · 字型 Noto Sans TC</text>

