  <!-- ===== 說明 ===== -->
  <text x="20" y="1940" font-size="13" font-weight="600" fill="#9AA4B2">說明</text>
  <g font-size="13" fill="#B6BEC8">
    <text x="20" y="1964">· 左欄 560 → 480。時鐘仍為 140px（實寬約 345px），兩側餘裕由 107px 降為 67px；日期行與提示行皆未超出。</text>
    <text x="20" y="1986">　 時鐘、日期、分隔線、提示的字級與垂直位置，與 7:3 版完全相同。</text>
    <text x="20" y="2008">· 右欄放大是改比例的目的，不是額外的設計變動。若維持原尺寸只會多出空白，無法反映 6:4 的實際效果。</text>
    <text x="20" y="2030">· 7:3 版的右欄 4 欄網格剛好用滿 208px（零餘裕），且 7 字天氣描述無法與圖示同列；6:4 版兩者皆有餘裕。</text>
    <text x="20" y="2052">· 6:4 可用 grid-cols-5 表達，比現行 grid-cols-10 單純。尚未套用「目前預報」標籤與資料過期標示。</text>
    <text x="20" y="2074">· 本預覽為 macOS 以 Noto Sans TC 算圖，不等於 Pi 面板呈現；圖示放大後的實際可辨識度仍須實機確認。</text>
  </g>
